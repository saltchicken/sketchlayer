[package]
name = "sketchlayer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sketchlayer"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.22.0", features = ["svg", "png"] }
gtk4 = "0.11.4"
gtk4-layer-shell = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
