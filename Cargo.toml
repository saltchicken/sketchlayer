[package]
name = "sketchlayer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sketchlayer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cairo-rs = { version = "0.22.0", features = ["svg", "png"] }
dirs = "5.0"
# Enable the v4_10 feature to access ColorDialog and ColorDialogButton
gtk4 = { version = "0.11.4", features = ["v4_10"] }
gtk4-layer-shell = "0.8.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
