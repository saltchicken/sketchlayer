[package]
name = "sketchlayer"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.9"
gtk4-layer-shell = "0.4"
cairo-rs = { version = "0.20", features = ["svg", "png"] }
gdk4 = "0.9"
glib = "0.20"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
